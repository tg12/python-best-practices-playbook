[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[project]
name = "python-best-practices-playbook"
version = "0.1.0"
description = "Research-backed Python repo blueprint and Codex skill built from common themes in respected Python template repositories."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [
  { name = "tg12" }
]
keywords = [
  "python",
  "best-practices",
  "template",
  "packaging",
  "github-actions",
  "llm-skill",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Quality Assurance",
]
dependencies = []

[project.optional-dependencies]
dev = [
  "mypy>=1.10.0",
  "pytest>=8.2.0",
  "ruff>=0.5.0",
]

[project.scripts]
python-best-practices = "python_best_practices_playbook.cli:main"

[project.urls]
Homepage = "https://github.com/tg12/python-best-practices-playbook"
Documentation = "https://github.com/tg12/python-best-practices-playbook#readme"
Source = "https://github.com/tg12/python-best-practices-playbook"
Issues = "https://github.com/tg12/python-best-practices-playbook/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/python_best_practices_playbook"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
  "E",
  "F",
  "I",
  "UP",
]

[tool.mypy]
python_version = "3.12"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
